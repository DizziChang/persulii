<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>我的會員 — per-sulii 沛素</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member/member.css">
</head>
<body>
<main class="wrap" id="app">
  <div class="loading">載入中…</div>
</main>

<script src="/member/member.js"></script>
<script>
(async () => {
  const app = document.getElementById('app');
  const { esc, money } = PS;
  try {
    await PS.init();
    let me;
    try {
      me = await PS.api('/api/member/me');
    } catch (e) {
      if (e.code === 'not_registered') { location.replace('/member/register' + location.search); return; }
      throw e;
    }
    const { orders } = await PS.api('/api/member/orders');
    const pic = PS.profile && PS.profile.pictureUrl;

    app.innerHTML = `
      <img class="brand" src="/images/per-sulii-logo-grayscale.webp" alt="per-sulii 沛素">
      <div class="who">
        ${pic ? `<img src="${esc(pic)}" alt="">` : '<span class="ph"></span>'}
        <div><div class="nm">${esc(me.displayName || me.name)}</div><div class="sub">會員自 ${esc(me.memberSince)}</div></div>
      </div>

      ${me.needsReview ? '<div class="notice">此電話已註冊過會員，請聯繫客服協助合併帳號。</div>' : ''}

      <section class="tier" data-tier="${esc(me.tier.code)}">
        <div class="label">MEMBERSHIP</div>
        <div class="tier-name">${esc(me.tier.name)}</div>
        <dl>
          <dt>專屬折扣</dt><dd>沛素精華液 2 入組合 ${esc(me.tier.discount)}</dd>
          <dt>效期</dt><dd>${me.tier.expiresAt ? esc(me.tier.expiresAt) + ' 到期' : '終身'}</dd>
        </dl>
        <p class="note">會員優惠限官方 LINE 下單。單筆購買 5 組升級 VIP（7 折）、20 組升級 VVIP（55 折），效期 1 年。</p>
      </section>

      <h2>購買紀錄</h2>
      <section class="card">
        ${orders.length ? orders.map((o) => `
          <div class="order">
            <div class="top">
              <div>${esc(o.date)}<span class="pill ${o.status}">${o.status === 'shipped' ? '已出貨' : '處理中'}</span></div>
              <div class="amt">${money(o.total)}</div>
            </div>
            <div class="no">${esc(o.orderNo)}</div>
            <ul>${o.items.map((i) => `<li>${esc(i.product_name)} × ${i.quantity}</li>`).join('')}</ul>
          </div>`).join('') : '<p class="empty">還沒有購買紀錄。歡迎在官方 LINE 聊天室直接下單。</p>'}
      </section>

      <h2>我的資料</h2>
      <section class="card">
        <dl class="rows">
          <dt>姓名</dt><dd>${esc(me.name)}</dd>
          <dt>電話</dt><dd>${esc(me.phoneMasked)}</dd>
        </dl>
        <p class="sub" style="margin-top:14px">資料需要修改，請在官方 LINE 聊天室告訴我們。</p>
      </section>
      <p class="foot">© per-sulii 沛素</p>`;
  } catch (e) {
    PS.fail(app, e);
  }
})();
</script>
</body>
</html>
