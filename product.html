<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前往產品頁 — 沛素 per-sulii</title>
  <!-- ============================================================
       舊網址轉址墊片

       產品頁已改為實體頁：/product.html?id=V-essence → /products/v-essence
       這個檔案只是讓改版前分享出去的舊連結不會壞掉。

       noindex 是為了不讓搜尋引擎把這個中繼頁當成一個獨立頁面收錄；
       真正的 301 要在 Cloudflare 的 Redirect Rules 設（規則能讀 ?id= 做條件
       判斷，靜態檔案做不到）。等 301 上線後，這個檔案就可以直接刪掉。
       ============================================================ -->
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id');
      var slug = id ? String(id).toLowerCase() : '';
      /* replace 而非 assign：不留下這一頁的瀏覽紀錄，按上一頁不會被彈回來 */
      location.replace(slug ? '/products/' + encodeURIComponent(slug) : '/products');
    })();
  </script>
</head>

<body>
  <p>產品頁已搬家，正在為你轉往新網址…… 若沒有自動跳轉，請點<a href="/products">產品列表</a>。</p>
</body>

</html>
