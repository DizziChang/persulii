backend:
  name: github
  repo: DizziChang/persulii
  branch: master
  base_url: https://sveltia-cms-auth.dizzistasks.workers.dev   # Cloudflare Worker OAuth 代理
  auth_endpoint: auth

site_url: https://persulii.com.tw
display_url: https://persulii.com.tw
media_folder: images
public_folder: /images

collections:
  - name: products
    label: 產品
    files:
      - name: products
        label: 產品列表
        file: content/products.json
        fields:
          - name: items
            label: 產品
            widget: list
            summary: "{{fields.en}} {{fields.name}}"
            fields:
              - { name: id, label: 產品代稱（英文、不可重複）, widget: string }
              - { name: code, label: 代號（單一字母）, widget: string }
              - { name: en, label: 英文名稱, widget: string }
              - { name: name, label: 中文名稱, widget: string }
              - { name: img, label: 主圖, widget: image }
              - { name: homeImg, label: 首頁圖（橫向）, widget: image, required: false }
              - { name: hoverImg, label: 滑過顯示圖, widget: image, required: false }
              - { name: hoverTitle, label: 滑過標題, widget: string, required: false }
              - { name: hoverDesc, label: 滑過說明, widget: string, required: false }
              - { name: banner, label: 產品頁橫幅（也會當成分享預覽圖）, widget: image, required: false }
              - { name: heroImg, label: 產品頁主圖, widget: image, required: false }
              - { name: tagline, label: 一句話賣點, widget: string }
              - { name: intro, label: 產品簡介, widget: text }
              - { name: highlights, label: 重點標籤（產品頁簡介下方的小圓標）, widget: list, required: false, field: { name: item, label: 標籤, widget: string } }
              - name: videoId
                label: YouTube 影片 ID
                widget: string
                required: false
                hint: 只填 ID，例如網址 https://youtu.be/U29afyMK6r4 就填 U29afyMK6r4。留空則產品頁不顯示影片。
              - name: benefits
                label: 保養功效
                widget: list
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: 功效名稱, widget: string }
                  - { name: body, label: 說明（可換行）, widget: text }
                  - { name: img, label: 圖片, widget: image }
              - name: feature
                label: 產品特色
                widget: text
                required: false
                hint: 只有在「保養功效」完全沒填時才會顯示，當作備援文案。
              - name: ingredients
                label: 關鍵成分
                widget: list
                fields:
                  - { name: en, label: 英文名, widget: string }
                  - { name: zh, label: 中文名, widget: string }
              - { name: audience, label: 適用族群, widget: list, required: false, field: { name: item, label: 族群, widget: string } }
              - { name: usageTitle, label: 使用方式標題, widget: string, required: false }
              - { name: usage, label: 使用方式（逐步驟）, widget: list, field: { name: step, label: 步驟, widget: string } }
              - { name: reminder, label: 注意事項（空一行分成一條）, widget: text, required: false }
              - name: specs
                label: 成分與規格
                widget: object
                fields:
                  - { name: inciTitle, label: 全成分表標題, widget: string, required: false }
                  - { name: inciList, label: 全成分表內容, widget: text, required: false }
                  - { name: inciNote, label: 全成分表附註, widget: string, required: false }
                  - name: inci
                    label: 成分標示（備援）
                    widget: text
                    required: false
                    hint: 只有在「全成分表內容」沒填時才會顯示。
                  - name: size
                    label: 容量 / 規格（目前頁面暫時隱藏）
                    widget: string
                    required: false
                  - name: cert
                    label: 品質認證（目前頁面暫時隱藏）
                    widget: string
                    required: false
              - name: bottleInfo
                label: 產品資訊表
                widget: object
                required: false
                fields:
                  - { name: brand, label: 品牌, widget: string }
                  - { name: name, label: 品名, widget: string }
                  - { name: enName, label: 英文名稱, widget: string }
                  - { name: volume, label: 容量, widget: string }

  - name: pages
    label: 頁面內容
    files:
      - name: home_hero
        label: 首頁主視覺 Banner
        file: content/home-hero.json
        fields:
          - name: images
            label: 輪播圖片（可多張，依序播放，每張可各自設定文字，留空則不顯示）
            widget: list
            summary: "{{fields.eyebrow}} {{fields.title}}"
            fields:
              - { name: img, label: 圖片, widget: image }
              - { name: eyebrow, label: 小標, widget: string, required: false }
              - name: title
                label: 圖片替代文字
                widget: text
                required: false
                hint: 不會顯示在畫面上，只當圖片的 alt（給搜尋引擎與讀屏軟體）。留空時改用「小標」。
              - { name: lead, label: 副標語, widget: string, required: false }
              - { name: btn1_text, label: 按鈕1文字, widget: string, required: false }
              - { name: btn1_link, label: 按鈕1連結, widget: string, required: false }
              - { name: btn2_text, label: 按鈕2文字, widget: string, required: false }
              - { name: btn2_link, label: 按鈕2連結, widget: string, required: false }
          - { name: interval, label: 輪播間隔（秒）, widget: number, default: 5, value_type: float }
      - name: home
        label: 首頁（其他區塊）
        file: content/home.json
        fields:
          # 目前首頁只吃這兩塊。science 的小標／說明／按鈕／圖片，以及整個
          # partner（合作夥伴）區塊，頁面上已經沒有對應的位置，放在後台只會
          # 讓人以為改得動，所以拿掉；content/home.json 裡的資料原樣保留，
          # 哪天版面加回來再把欄位補回來即可。
          - name: science
            label: 關於我們區塊
            widget: object
            fields:
              - { name: title, label: 標題, widget: string }
          - name: products_section
            label: 產品區標題
            widget: object
            fields:
              - { name: eyebrow, label: 英文小標, widget: string }
              - { name: title, label: 標題, widget: string }
      - name: about_sections
        label: 關於頁－內容區塊
        file: content/about-sections.json
        fields:
          - name: sections
            label: 內容區塊（共4段）
            widget: list
            allow_add: false
            summary: "{{fields.title}}"
            fields:
              - name: eyebrow
                label: 英文小標
                widget: string
                required: false
                hint: 只有第 1 段的小標會顯示，其餘段落頁面上沒有小標的位置。
              - { name: title, label: 標題（可換行）, widget: text }
              - { name: body, label: 內文（空一行分段）, widget: text }
              # 關於頁沒有任何段落圖片的版位（about.html 只有 title／body），
              # 所以不開放「圖片」欄位。
      # 「關於頁－研發團隊」已移除：content/about-team.json 沒有任何程式讀取，
      # about.html 上也沒有研發團隊區塊，改了不會有任何效果。
      - name: faq
        label: 常見問答頁
        file: content/faq.json
        fields:
          - name: faq
            label: 常見問答
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: 問題, widget: string }
              - { name: a, label: 回答, widget: text }
      - name: settings_footer
        label: 網站設定－Footer
        file: content/settings-footer.json
        fields:
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: tagline, label: 品牌標語, widget: string }
              - { name: company, label: 公司名稱, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: phone, label: 電話, widget: string }
              - { name: copyright, label: 版權文字, widget: string }
              - { name: cert_chip, label: 認證標章文字, widget: string }
              - name: social
                label: 社群連結
                widget: object
                fields:
                  - { name: line, label: Line, widget: string }
                  - { name: facebook, label: Facebook, widget: string }
                  - { name: instagram, label: Instagram, widget: string }
      - name: settings_contact
        label: 網站設定－聯絡頁資訊
        file: content/settings-contact.json
        fields:
          - name: contact_page
            label: 聯絡頁資訊
            widget: object
            fields:
              - { name: company, label: 公司名稱, widget: string }
              - { name: phone, label: 電話, widget: string }
              - { name: address, label: 地址, widget: string }
