<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>訂單列表 — 沛素會員後台</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/ms.css">
</head>
<body>
<main>
  <div class="spread">
    <h1>訂單</h1>
    <a class="btn" href="/admin/orders/new">＋ 建立訂單</a>
  </div>
  <div id="flash"></div>
  <div class="tabs" id="tabs">
    <button data-s="pending">待出貨</button>
    <button data-s="shipped">已出貨</button>
    <button data-s="voided">已作廢</button>
    <button data-s="">全部</button>
  </div>
  <div class="card">
    <div class="tablewrap">
      <table>
        <thead><tr><th>訂單編號</th><th>建單時間</th><th>會員</th><th>品項</th><th>收件地址</th><th class="num">金額</th><th>狀態</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">載入中…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/admin/ms.js"></script>
<script>
(async () => {
  if (!(await MS.boot('orders'))) return;
  const { esc, money } = MS;
  const $ = (id) => document.getElementById(id);
  let status = new URLSearchParams(location.search).get('status') ?? 'pending';

  async function load() {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.s === status));
    history.replaceState(null, '', '?status=' + status);
    $('rows').innerHTML = '<tr><td colspan="8" class="muted">載入中…</td></tr>';
    try {
      const { orders } = await MS.api('/api/admin/orders' + (status ? '?status=' + status : ''));
      $('rows').innerHTML = orders.length ? orders.map((o) => `
        <tr>
          <td>${esc(o.orderNo)} ${o.upgraded ? '<span class="badge up">升級單</span>' : ''}${o.note ? `<div class="small muted wrap">${esc(o.note)}</div>` : ''}</td>
          <td class="small">${esc(MS.twTime(o.createdAt))}</td>
          <td><a href="/admin/members/${esc(o.memberId)}">${esc(o.memberName)}</a><div>${MS.tierBadge(o.tierAtOrder)}</div></td>
          <td class="small">${o.items.map((i) => `${esc(i.product_name)} × ${i.quantity}`).join('<br>')}</td>
          <td class="small wrap">${esc(o.shipAddress || '—')}</td>
          <td class="num">${money(o.total)}</td>
          <td>${MS.statusBadge(o.status)}${o.shippedAt ? `<div class="small muted">${esc(MS.twTime(o.shippedAt).split(' ')[0])}</div>` : ''}</td>
          <td><div class="row" style="flex-wrap:nowrap">
            ${o.status === 'pending' ? `<button class="btn sm" data-act="ship" data-id="${esc(o.id)}">出貨</button>` : ''}
            ${o.status === 'shipped' ? `<button class="btn sm ghost" data-act="unship" data-id="${esc(o.id)}">改回待出貨</button>` : ''}
            ${o.status !== 'voided' ? `<button class="btn sm ghost" data-act="void" data-id="${esc(o.id)}" data-no="${esc(o.orderNo)}" data-up="${o.upgraded ? 1 : 0}">作廢</button>` : ''}
          </div></td>
        </tr>`).join('') : '<tr><td colspan="8" class="muted">沒有訂單</td></tr>';

      document.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => act(b)));
    } catch (e) {
      $('rows').innerHTML = `<tr><td colspan="8" class="err">${esc(e.message)}</td></tr>`;
    }
  }

  async function act(b) {
    const { act, id, no, up } = b.dataset;
    if (act === 'void') {
      const ok = await MS.confirmDialog({
        title: '作廢訂單 ' + no,
        body: '作廢後訂單保留紀錄但不可恢復。' + (up === '1' ? '<br>這是升級單：建單日起 21 天內作廢，會員等級會回復到升級前；超過 21 天則等級不變。' : ''),
        ok: '作廢', danger: true
      });
      if (!ok) return;
    }
    b.disabled = true;
    try {
      const r = await MS.api('/api/admin/orders/' + id, { method: 'PATCH', body: JSON.stringify({ action: act }) });
      $('flash').innerHTML = act === 'void'
        ? `<div class="alert ok">已作廢 ${esc(no)}${r.tierReverted ? '，會員等級已回復到升級前' : ''}。</div>`
        : '';
      load();
    } catch (e) {
      alert(e.message);
      b.disabled = false;
    }
  }

  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { status = b.dataset.s; $('flash').innerHTML = ''; load(); }));
  load();
})();
</script>
</body>
</html>
