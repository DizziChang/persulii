<body data-page="contact">

  <div id="site-header"></div>

  <main>

    <img src="/images/recruit-banner.webp" alt="成為沛素夥伴" style="width:100%;height:auto;display:block">

    <section class="pagehead wrap" style="border-bottom: 1px solid var(--line);">
      <div class="wrap">
        <div class="crumb"><a href="/">首頁</a> / 經銷通路</div>
        <h1 class="h2 mt16">官方通路與經銷合作</h1>
      </div>
    </section>

    <section class="sec tight">
      <div class="wrap" style="max-width: 1000px;">
        <h2 class="h3 center" id="channels-heading"></h2>
        <ul class="channel-list mt32" id="channels-list"></ul>
      </div>
    </section>

    <section class="sec tight" style="padding-top:clamp(38px,4.8vw,72px);padding-bottom:clamp(38px,4.8vw,72px)">
      <div class="wrap" style="max-width: 960px;">
       <h2 class="h3 center">與我們聯繫</h2>
        <form id="contact-form" novalidate>
          <input type="hidden" name="access_key" value="c44f2510-388b-477e-a3ec-f2446b1304c2">
          <input type="hidden" name="subject" value="與沛素聯繫">
          <input type="checkbox" name="botcheck" class="sr-only" tabindex="-1" autocomplete="off">
          <div class="field">
            <label for="f-contact">姓名 <span class="req">*</span></label>
            <input id="f-contact" name="contact" type="text" placeholder="請輸入" required>
          </div>
          <div class="grid g2" style="gap:18px">
            <div class="field">
              <label for="f-phone">電話 <span class="req">*</span></label>
              <input id="f-phone" name="phone" type="tel" placeholder="請輸入" required>
            </div>
            <div class="field">
              <label for="f-email">Email</label>
              <input id="f-email" name="email" type="email" placeholder="請輸入">
            </div>
          </div>
          <div class="field">
            <label for="f-msg">留言內容</label>
            <textarea id="f-msg" name="message" rows="5" placeholder="請描述您的問題或需求"></textarea>
          </div>
          <div class="field">
            <label for="f-captcha">驗證碼 <span class="req">*</span></label>
            <div class="captcha-row">
              <input id="f-captcha" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="請輸入驗證碼" required>
              <canvas id="captcha-canvas" class="captcha-canvas" width="120" height="48" role="img" aria-label="驗證碼圖片，點擊可更換" title="看不清楚？點擊更換"></canvas>
              <button type="button" class="captcha-refresh" id="captcha-refresh" aria-label="更換驗證碼"><img src="/images/icon/refresh.svg" alt="" width="14" height="14">再換一組</button>
            </div>
          </div>
          <div class="center mt32">
            <button type="submit" class="btn solid" id="contact-submit-btn">送出</button>
            <p class="small mt16" id="contact-form-status" style="display:none"></p>
          </div>
        </form>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
