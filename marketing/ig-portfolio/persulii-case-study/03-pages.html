<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>MODI DESIGN × per-sulii — 頁面精選</title>
<link rel="stylesheet" href="shared.css">
<style>
  .pg-body { flex: 1; display: flex; flex-direction: column; gap: 34px; margin-top: 28px; justify-content: center; }

  .pg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
  .pg-card img { height: 232px; }
  .pg-card .shot-label { padding: 12px 16px 14px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame-pad">

      <div class="frame-header">
        <div class="md-mark"><i class="dot"></i><span>Modi Design</span></div>
        <div class="frame-tag">per-sulii Case Study</div>
      </div>

      <div class="pg-body">
        <div>
          <div class="slide-kicker">Site Structure</div>
          <div class="slide-title">頁面精選<span class="en">SELECTED PAGES</span></div>
          <div class="slide-desc">首頁、關於我們、產品、經銷通路四大頁面，統一版型語彙，讓瀏覽動線與品牌故事一氣呵成。</div>
        </div>

        <div class="pg-grid">
          <div class="pg-card shot-card">
            <div class="browser-chrome"><i></i><i></i><i></i></div>
            <img class="shot-img" src="assets/home-hero.jpg" alt="首頁">
            <div class="shot-label"><span class="zh">首頁</span><span class="en">Home</span></div>
          </div>
          <div class="pg-card shot-card">
            <div class="browser-chrome"><i></i><i></i><i></i></div>
            <img class="shot-img" src="assets/about.jpg" alt="關於我們">
            <div class="shot-label"><span class="zh">關於我們</span><span class="en">About</span></div>
          </div>
          <div class="pg-card shot-card">
            <div class="browser-chrome"><i></i><i></i><i></i></div>
            <img class="shot-img" src="assets/products.jpg" alt="產品">
            <div class="shot-label"><span class="zh">產品</span><span class="en">Products</span></div>
          </div>
          <div class="pg-card shot-card">
            <div class="browser-chrome"><i></i><i></i><i></i></div>
            <img class="shot-img" src="assets/contact.jpg" alt="經銷通路">
            <div class="shot-label"><span class="zh">經銷通路</span><span class="en">Contact</span></div>
          </div>
        </div>
      </div>

      <div class="frame-footer">
        <div class="site">modidesign.com.tw</div>
        <div class="count">03 — 05</div>
      </div>

    </div>
  </div>
</body>
</html>
