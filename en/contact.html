<body data-page="contact">

  <div id="site-header"></div>

  <main>

    <section class="sec" style="padding-bottom:0">
      <div class="wrap" style="max-width:620px">
        <img src="/images/recruit.webp" alt="Become a per-sulii partner" style="width:100%;height:auto;display:block">
      </div>
    </section>

    <section class="sec" style="padding-top:clamp(38px,4.8vw,72px);padding-bottom:clamp(38px,4.8vw,72px)">
      <form class="wrap" style="max-width:620px" id="contact-form">
        <input type="hidden" name="access_key" value="c44f2510-388b-477e-a3ec-f2446b1304c2">
        <input type="hidden" name="subject" value="per-sulii Website Distribution Inquiry">
        <input type="checkbox" name="botcheck" class="sr-only" tabindex="-1" autocomplete="off">
        <h1 class="h2 center" style="margin-bottom:40px">Get in Touch</h1>
        <div class="field">
          <label for="f-company">Company / Brand Name</label>
          <input id="f-company" name="company" type="text" placeholder="Enter here">
        </div>
        <div class="field">
          <label for="f-contact">Contact Person</label>
          <input id="f-contact" name="contact" type="text" placeholder="Enter here">
        </div>
        <div class="grid g2" style="gap:18px">
          <div class="field">
            <label for="f-phone">Phone</label>
            <input id="f-phone" name="phone" type="tel" placeholder="Enter here">
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" placeholder="Enter here">
          </div>
        </div>
        <div class="field">
          <label for="f-msg">Tell us what you need</label>
          <textarea id="f-msg" name="message" rows="5" placeholder="Briefly describe your partnership needs"></textarea>
        </div>
        <div class="center mt32">
          <button type="submit" class="btn solid" id="contact-submit-btn">Send Inquiry</button>
          <p class="small mt16" id="contact-form-status" style="display:none"></p>
        </div>
      </form>
    </section>

    <!-- Contact info -->
    <section class="sec tight" style="background:var(--bg)">

        <div class="eyebrow">Contact Info</div>
        <h2 class="h3 mt16" id="contact-company">諾田康美有限公司 (Persulii Wellness & Beauty Co., Ltd)</h2>
        <p class="body mt8" id="contact-phone">+886-6-5700600</p>
        <p class="body mt8" id="contact-address">No. 116, Kezih-liao, Madou Dist., Tainan City, Taiwan</p>
      </div>
    </section>
