<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>MODI DESIGN × per-sulii — 追蹤 CTA</title>
<link rel="stylesheet" href="shared.css">
<style>
  .cta-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 48px;
  }

  .cta-kicker { justify-content: center; }

  .cta-statement {
    font-family: var(--md-serif);
    font-weight: 700;
    font-size: 68px;
    line-height: 1.28;
    color: var(--md-ink);
  }

  .follow-pill {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    background: var(--md-ink);
    color: #fff;
    padding: 22px 42px;
    border-radius: 999px;
    box-shadow: 0 20px 40px -18px rgba(34,31,28,.5);
  }
  .follow-pill .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--md-accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--md-serif); font-weight: 700; font-size: 24px; color: #fff;
  }
  .follow-pill .handle { font-family: var(--md-sans); font-weight: 700; font-size: 30px; letter-spacing: .01em; }
  .follow-pill .word { font-family: var(--md-sans); font-weight: 500; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--md-accent-soft); }
  .follow-pill .arrow { font-size: 22px; }

  .cta-services { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 780px; }
  .cta-services .tag-pill { border-color: var(--md-line); color: var(--md-ink-soft); font-weight: 600; font-size: 14px; padding: 10px 22px; background: var(--md-card); }
  .cta-services .tag-pill i { width: 5px; height: 5px; border-radius: 50%; background: var(--md-accent); display: inline-block; }

  .cta-sub {
    font-family: var(--md-sans);
    font-size: 16px;
    line-height: 1.7;
    color: var(--md-ink-soft);
    max-width: 620px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame-pad">

      <div class="frame-header">
        <div class="md-mark"><i class="dot"></i><span>Modi Design</span></div>
        <div class="frame-tag">per-sulii Case Study</div>
      </div>

      <div class="cta-body">
        <div class="slide-kicker cta-kicker">Thanks for Watching · 感謝觀看</div>

        <div class="cta-statement">想擁有這樣的<br>品牌官網嗎？</div>

        <div class="follow-pill">
          <span class="avatar">M</span>
          <span class="handle">@modidesign</span>
          <span class="arrow">→</span>
        </div>

        <div class="cta-services">
          <span class="tag-pill"><i></i>網站設計策略</span>
          <span class="tag-pill"><i></i>視覺網頁設計</span>
          <span class="tag-pill"><i></i>架設與維運</span>
          <span class="tag-pill"><i></i>流量數據優化</span>
        </div>

        <div class="cta-sub">從策略規劃、視覺設計、網站架設到流量數據優化，一站式陪你打造有效轉換的品牌網站。</div>
      </div>

      <div class="frame-footer">
        <div class="site">modidesign.com.tw</div>
        <div class="count">05 — 05</div>
      </div>

    </div>
  </div>
</body>
</html>
